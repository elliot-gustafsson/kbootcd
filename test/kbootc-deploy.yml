---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kbootcd
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kbootcd
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete", "get"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kbootcd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kbootcd
subjects:
  - kind: ServiceAccount
    name: kbootcd
    namespace: kube-system

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kbootcd
  namespace: kube-system
data:
  target_image: "localhost/kbootcd-test/rke2:almalinux10"

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kbootcd
  namespace: kube-system
  labels:
    app: kbootcd
spec:
  selector:
    matchLabels:
      app: kbootcd
  template:
    metadata:
      labels:
        app: kbootcd
    spec:
      serviceAccountName: kbootcd
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: kbootcd
          image: localhost/kbootcd:latest
          imagePullPolicy: IfNotPresent
          args:
            - --cooldown-delay=5m
            - --end-time=17:00
            - --interval=2m
            - --log-format=json
            - --reboot-days=mon,tue,wed,thu,fri
            - --start-time=08:00
            - --time-zone=Europe/Stockholm
          securityContext:
            privileged: true
          resources:
            limits:
              memory: 500Mi
            requests:
              cpu: 50m
              memory: 500Mi
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: bootc-config
              mountPath: /etc/bootc-config
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: bootc-config
          configMap:
            name: kbootcd
